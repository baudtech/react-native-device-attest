name: Check Codegen

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen:
    name: Verify nitrogen output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      # The full pipeline from the `codegen` script, minus the library build.
      # post-script.js is not optional: it rewrites the Android JNI descriptor
      # to match the com.deviceattest implementation package, and raw nitrogen
      # output fails the class lookup at runtime.
      - name: Run codegen
        run: |
          bunx nitrogen
          node post-script.js

      - name: Fail if generated code is stale
        run: |
          if ! git diff --exit-code -- nitrogen/generated; then
            echo "::error::nitrogen/generated does not match 'nitrogen && node post-script.js' for the pinned nitrogen version. Run 'npm run codegen' and commit the result."
            exit 1
          fi
