version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'

  - package-ecosystem: 'gradle'
    directories:
      - '/android/'
      - '/example/android/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'

  - package-ecosystem: 'bundler'
    directory: '/example/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'

  - package-ecosystem: 'npm'
    directories:
      - '/example/'
      - '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'

    ignore:
      # RN 0.86 ships Babel 7 plugins, and @babel/runtime 8 drops entrypoints
      # they still target (regenerator, helpers/esm/*). Revisit when RN
      # supports Babel 8.
      - dependency-name: '@babel/*'
        update-types:
          - 'version-update:semver-major'

    groups:
      # react-native and its satellites are version-locked to each other, as
      # are the react and expo versions each RN release is built against.
      # Keep them in one PR so they can never drift apart.
      react-native:
        patterns:
          - 'react-native'
          - '@react-native/*'
          - 'react'
          - '@types/react'
          - 'expo'
      react-native-cli:
        patterns:
          - '@react-native-community/cli*'
      babel:
        patterns:
          - '@babel/*'
      nitro:
        patterns:
          - 'nitrogen'
          - 'react-native-nitro-modules'
